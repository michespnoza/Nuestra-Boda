<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Michelle y René</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
	<!-- BLOQUEO PARA COMPUTADORAS - AGREGAR ESTO -->
    <script>
        // Función para detectar si es un dispositivo móvil
        function esMovil() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        // Si NO es un móvil, muestra un mensaje y bloquea el acceso
        if (!esMovil()) {
            // Reemplaza todo el cuerpo del documento con un mensaje
            document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Invitación de Boda</title>
                    <style>
                        body {
                            font-family: Arial, sans-serif;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            background-color: #f8f0e5;
                            text-align: center;
                            padding: 20px;
                        }
                        .mensaje {
                            max-width: 500px;
                            padding: 30px;
                            background: white;
                            border-radius: 15px;
                            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                        }
                        h1 {
                            color: #941212;
                            margin-bottom: 20px;
                        }
                        p {
                            color: #555;
                            line-height: 1.6;
                            margin-bottom: 15px;
                        }
                        .icono {
                            font-size: 50px;
                            margin-bottom: 20px;
                        }
                    </style>
                </head>
                <body>
                    <div class="mensaje">
                        <div class="icono">📱</div>
                        <h1>Invitación Mobile Only</h1>
                        <p>¡Hola! Nuestra invitación está diseñada para verse mejor en dispositivos móviles.</p>
                        <p><strong>Por favor, ábrela desde tu teléfono celular.</strong></p>
                        <p>♡ <em>Te agradecemos mucho.</em></p>
                    </div>
                </body>
                </html>
            `);
            // Detiene la ejecución de cualquier otro script
            throw new Error("Acceso permitido solo en móviles");
        }
    </script>
</head>
<body>
    <div class="contenedor">
        <!-- Leyenda con efecto de máquina de escribir -->
        <h2 class="leyenda" id="maquina-escribir"></h2>

        <!-- Imagen en presentacion -->
        <img src="images/inicio.png?v=2" alt="Michelle y René" class="presentacion">
        
        <!-- Imagen dias salon -->
        <img src="images/molino.png" alt="imagen letras atras" class="atras">

        <a href="https://www.google.com/maps/place/Sal%C3%B3n+El+Molino/@20.0896642,-101.4779955,17z/data=!4m14!1m7!3m6!1s0x842c51ef70f894a5:0x89f8a440183f0a51!2sSal%C3%B3n+El+Molino!8m2!3d20.0896642!4d-101.4779955!16s%2Fg%2F11h7cwlp0l!3m5!1s0x842c51ef70f894a5:0x89f8a440183f0a51!8m2!3d20.0896642!4d-101.4779955!16s%2Fg%2F11h7cwlp0l?entry=ttu&g_ep=EgoyMDI1MDYzMC.0IKXMDSoASAFQAw%3D%3D" target="_blank">(Ubicación)</a> 
 
        <!-- Cuenta regresiva -->
        <div class="cuenta-regresiva">
            <p class="texto-cuenta"></p>
            <div id="cuenta"></div>
        </div>
       
        <!-- Foto de ustedes -->
        <img src="images/detalles.png" alt="Michelle y René" class="foto2">
        
        <!-- Imagen confirmar -->
        <img src="images/dresscode.png" alt="Confirmar" class="dresscode">

        <!-- Imagen confirmar -->
        <img src="images/confirmar2.png" alt="Confirmar" class="confirmar">

        <!-- ✅ SCRIPT PRIMERO - Así las funciones se cargan antes que el formulario -->
        <script>
        // Variable para guardar el ID y datos del invitado encontrado
        let invitadoData = null;

        async function buscarInvitado() {
            const telefono = document.getElementById('telefono').value.trim();
            const mensajePersonalizado = document.getElementById('mensaje-personalizado');
            const contenedor = document.getElementById('confirmacion-container');
            const resultado = document.getElementById('mensaje-resultado');
            const botonBuscar = document.querySelector('.formulario button');

            resultado.textContent = '';

            if (!telefono) {
                resultado.textContent = "Por favor, ingresa tu número de teléfono.";
                return;
            }

            try {
                const response = await fetch('https://api.airtable.com/v0/appU5p0cqIiGjJ7Q0/Invitados?filterByFormula={Telefono}="'+telefono+'"', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer patMPTtIbHZPDRsVW.5c76cca894828c43b7269894259b4d33ffb41b260c8761637c7dc3ce8815e137',
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.records.length > 0) {
                    invitadoData = data.records[0];
                    const nombre = invitadoData.fields.Nombre;
                    const numInvitados = invitadoData.fields.Invitados;

                    crearCorazones(botonBuscar);
                    
                    mensajePersonalizado.innerHTML = `Hola <strong>${nombre}</strong>. Hemos reservado <strong>${numInvitados} lugar(es)</strong> para ti. ¿Confirmas tu asistencia?`;
                    contenedor.style.display = 'block';

                } else {
                    resultado.textContent = "❌ No encontramos una invitación con ese número. Por favor, verifica o contacta a los novios.";
                }
            } catch (error) {
                resultado.textContent = "Error de conexión. Intenta más tarde.";
                console.error("Error detallado:", error);
            }
        }

        // Función para crear los corazones mágicos
        function crearCorazones(boton) {
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                heart.innerHTML = `
        <svg viewBox="0 0 24 24" width="30" height="30">
        <path fill="#941212" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
                `;
                
                const rect = boton.getBoundingClientRect();
                const x = rect.left + (Math.random() * rect.width);
                const y = rect.top + (Math.random() * rect.height);
                
                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 500);
            }
        }

        // ✅ FUNCIÓN CORREGIDA - Esta SÍ funciona
        async function enviarConfirmacion() {
            const respuestaSeleccionada = document.querySelector('input[name="respuesta"]:checked');
            const resultado = document.getElementById('mensaje-resultado');

            if (!respuestaSeleccionada || !invitadoData) {
                resultado.textContent = "Por favor, busca tu invitación y selecciona una opción.";
                return;
            }

            const confirmacion = respuestaSeleccionada.value;

            try {
                // ✅ SOLO el campo Confirmacion (sin fecha por ahora)
                const response = await fetch('https://api.airtable.com/v0/appU5p0cqIiGjJ7Q0/Invitados/' + invitadoData.id, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': 'Bearer patMPTtIbHZPDRsVW.5c76cca894828c43b7269894259b4d33ffb41b260c8761637c7dc3ce8815e137',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: {
                            "Confirmacion": confirmacion
                        }
                    })
                });

                const responseText = await response.text();
                console.log("Status:", response.status);
                console.log("Response:", responseText);

                if (response.ok) {
                    resultado.innerHTML = `✅ <strong>¡Estas dentro 💕!</strong> Tu respuesta (<strong>${confirmacion}</strong>) ha sido registrada.`;
                    document.getElementById('confirmacion-container').style.display = 'none';
                } else {
                    resultado.textContent = "❌ Error al guardar. Intenta más tarde.";
                }
            } catch (error) {
                resultado.textContent = "❌ Error de conexión. Intenta más tarde.";
                console.error("Error detallado:", error);
            }
        }
        </script>

        <!-- ✅ AHORA SÍ - Formulario después del script -->
        <div class="formulario">
            <h3>Confirma tu asistencia</h3>
            
            <!-- Paso 1: Pide SOLO el teléfono -->
            <p>Por favor, ingresa tu número de teléfono para confirmar:</p>
            <input type="tel" id="telefono" placeholder="Ej. 5512345678" required>
            <button onclick="buscarInvitado()">Buscar Invitación</button>
            
            <!-- Paso 2: Mensaje personalizado y opciones SÍ/NO -->
            <div id="confirmacion-container" style="display: none;">
                <p id="mensaje-personalizado"></p>
                <div>
                    <input type="radio" name="respuesta" id="si" value="Sí" required> <label for="si">Sí, asistiré</label><br>
                    <input type="radio" name="respuesta" id="no" value="No"> <label for="no">No, no podré asistir</label>
                </div>
                <button onclick="enviarConfirmacion()">Enviar Confirmación</button>
            </div>

            <p id="mensaje-resultado"></p>
        </div>

        <script src="script.js"></script>
    </div>
</body>
</html>
